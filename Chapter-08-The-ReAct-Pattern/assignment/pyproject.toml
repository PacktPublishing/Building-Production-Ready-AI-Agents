[project]
name = "react-agent"
version = "0.1.0"
description = "ReAct Agent example with Ollama integration"
requires-python = ">=3.10"
dependencies = [
    "colorama>=0.4.6",
    "ollama>=0.1.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sequencing_actions"]
