<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Document Search</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .layout {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin-top: 20px;
        }

        .panel {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        .search-panel {
            flex: 1;
            min-width: 0;
        }

        .docs-panel {
            flex: 1;
            min-width: 0;
            max-height: 90vh;
            overflow-y: auto;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active { transform: translateY(0); }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results { display: none; }
        .results.show { display: block; }

        .query-text {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }

        .result-content {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            line-height: 1.6;
            color: #333;
            max-height: 500px;
            overflow-y: auto;
            font-size: 15px;
            white-space: pre-wrap;
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 8px;
            padding: 15px;
            color: #c33;
            display: none;
        }
        .error.show { display: block; }

        /* Document rendered as one continuous flow */
        .doc-content {
            font-size: 14px;
            line-height: 1.7;
            color: #333;
        }

        .doc-content h1 { font-size: 22px; margin: 16px 0 10px; color: #222; }
        .doc-content h2 { font-size: 18px; margin: 14px 0 8px; color: #333; }
        .doc-content h3 { font-size: 16px; margin: 12px 0 6px; color: #444; }
        .doc-content h4 { font-size: 14px; margin: 10px 0 4px; color: #555; }
        .doc-content p { margin: 6px 0; }
        .doc-content ul, .doc-content ol { margin: 6px 0 6px 20px; }
        .doc-content li { margin: 2px 0; }
        .doc-content hr { border: none; border-top: 1px solid #e0e0e0; margin: 12px 0; }
        .doc-content code { background: #f0f0f0; padding: 2px 5px; border-radius: 3px; font-size: 13px; }

        .chunk-section {
            padding: 8px 12px;
            border-radius: 6px;
            transition: background 0.3s;
        }

        .chunk-section.highlight {
            background: #fff9c4;
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="panel search-panel">
            <h2>🔍 Search</h2>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Ask a question about the document..." autocomplete="off">
                <button onclick="performSearch()">Search</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Searching...</p>
            </div>

            <div class="error" id="error"></div>

            <div class="results" id="results">
                <div class="query-text" id="queryText"></div>
                <div class="result-content" id="resultContent"></div>
            </div>
        </div>

        <div class="panel docs-panel">
            <h2>📄 Document</h2>
            <div class="doc-content" id="chunksContainer">Loading document...</div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const error = document.getElementById('error');
        const chunksContainer = document.getElementById('chunksContainer');

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        async function loadChunks() {
            try {
                const res = await fetch('/api/chunks');
                const data = await res.json();
                chunksContainer.innerHTML = '';
                data.chunks.forEach((text, i) => {
                    const section = document.createElement('div');
                    section.className = 'chunk-section';
                    section.id = `chunk-${i}`;
                    section.innerHTML = marked.parse(text);
                    chunksContainer.appendChild(section);
                });
            } catch (err) {
                chunksContainer.textContent = 'Failed to load document.';
            }
        }

        function highlightChunk(index) {
            document.querySelectorAll('.chunk-section').forEach(el => el.classList.remove('highlight'));
            if (index >= 0) {
                const el = document.getElementById(`chunk-${index}`);
                if (el) {
                    el.classList.add('highlight');
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        async function performSearch() {
            const prompt = searchInput.value.trim();
            if (!prompt) { showError('Please enter a search query'); return; }

            loading.style.display = 'block';
            results.classList.remove('show');
            error.classList.remove('show');
            highlightChunk(-1);

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const contentType = response.headers.get('content-type') || '';
                if (contentType.includes('application/json')) {
                    const data = await response.json();
                    document.getElementById('queryText').textContent = `Query: "${prompt}"`;
                    document.getElementById('resultContent').textContent = data.result;
                    results.classList.add('show');
                    loading.style.display = 'none';
                    return;
                }

                document.getElementById('queryText').textContent = `Query: "${prompt}"`;
                const resultContent = document.getElementById('resultContent');
                resultContent.textContent = '';
                results.classList.add('show');
                loading.style.display = 'none';

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let firstLine = true;
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const text = decoder.decode(value, { stream: true });

                    if (firstLine) {
                        buffer += text;
                        const newlineIdx = buffer.indexOf('\n');
                        if (newlineIdx !== -1) {
                            const meta = JSON.parse(buffer.substring(0, newlineIdx));
                            highlightChunk(meta.matched_chunk);
                            resultContent.textContent += buffer.substring(newlineIdx + 1);
                            firstLine = false;
                            buffer = '';
                        }
                    } else {
                        resultContent.textContent += text;
                    }
                }
            } catch (err) {
                showError(`Search failed: ${err.message}`);
                loading.style.display = 'none';
            }
        }

        function showError(message) {
            error.textContent = message;
            error.classList.add('show');
        }

        loadChunks();
    </script>
</body>
</html>
