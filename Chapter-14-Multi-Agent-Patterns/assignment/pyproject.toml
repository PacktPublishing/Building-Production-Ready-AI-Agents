[project]
name = "ch14-multi-agent-patterns-assignment"
version = "0.1.0"
description = "Chapter 14 assignment: pattern comparison and benchmark workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "httpx>=0.28.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "webapp", "app_models", "patterns", "benchmark"]

[tool.pytest.ini_options]
pythonpath = ["."]
