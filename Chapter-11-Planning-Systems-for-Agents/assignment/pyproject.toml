[project]
name = "ch11-pizza-agent-assignment"
version = "0.1.0"
description = "Chapter 11 assignment solution: pizza ordering agent with planner-executor-monitor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[tool.pytest.ini_options]
markers = [
  "integration: marks tests that require a live Ollama endpoint"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
