[project]
name = "chapter-12-orchestration-patterns"
version = "0.1.0"
description = "CLI demos for sequential, parallel, and routed orchestration with Ollama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "common",
    "sequential",
    "parallel",
    "routed",
]