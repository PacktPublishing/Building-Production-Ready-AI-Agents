[project]
name = "chapter12-orchestration-workbench"
version = "0.1.0"
description = "Interactive orchestration strategy workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "ollama>=0.6.2",
    "uvicorn[standard]>=0.35.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]
